# This catch-all is intentionally last: Netlify applies only the first matching
# header rule. Specific assets above get longer browser caching; everything else
# gets a short TTL plus the same security policy.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=300"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://static.cloudflareinsights.com/beacon.min.js; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; frame-src 'self'; frame-ancestors 'self'; form-action 'self'; media-src 'self'; manifest-src 'self'; worker-src 'none'; upgrade-insecure-requests"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), browsing-topics=(), fullscreen=(self)"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-Permitted-Cross-Domain-Policies = "none"
    Cross-Origin-Opener-Policy = "same-origin"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Passive visits only load lightweight posters; the live runtime loads on user
# intent. Allow generous bursts for real users and shared networks while capping
# a single abusive client at four requests/second over a rolling minute.
[[redirects]]
  from = "/*"
  to = "/:splat"

  [redirects.rate_limit]
    window_limit = 240
    window_size = 60
    aggregate_by = ["ip", "domain"]
