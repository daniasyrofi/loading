<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#050505" />

  <meta name="description" content="A collection of animated loaders, progress indicators, and playful waiting states. Explore the motion studies by Dani Asyrofi." />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Loading" />
  <meta property="og:title" content="Loading — Animated loaders for moments in between" />
  <meta property="og:description" content="A collection of animated loaders, progress indicators, and playful waiting states. Explore the motion studies by Dani Asyrofi." />
  <meta property="og:url" content="https://loading.daniasyrofi.com/" />
  <meta property="og:image" content="https://loading.daniasyrofi.com/assets/og-image.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="2400" />
  <meta property="og:image:height" content="1260" />
  <meta property="og:image:alt" content="Collection of Loading Animations — animated loading indicators on a dark blue pixel background." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:creator" content="@dani_asyrofi" />
  <meta name="twitter:title" content="Loading — Animated loaders for moments in between" />
  <meta name="twitter:description" content="A collection of animated loaders, progress indicators, and playful waiting states by Dani Asyrofi." />
  <meta name="twitter:image" content="https://loading.daniasyrofi.com/assets/og-image.png" />
  <meta name="twitter:image:alt" content="Collection of Loading Animations — animated loading indicators on a dark blue pixel background." />
  <link rel="preload" href="./assets/fonts/gentium-plus-latin-regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="./assets/fonts/gentium-plus.css" />
  <link rel="preload" href="./assets/fonts/plus-jakarta-sans-latin-variable.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="./assets/fonts/plus-jakarta-sans.css" />
  <link rel="icon" type="image/svg+xml" sizes="any" href="./assets/favicon.svg?v=2" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./playground.css" />
</head>
<body>
  <div class="shooting-sky" data-shooting-sky aria-hidden="true">
    <span class="shooting-star"></span>
    <span class="shooting-star"></span>
  </div>
  <header class="site-header page-width" aria-label="Loading navigation">
    <a class="back-link" href="https://daniasyrofi.com" aria-label="Back to daniasyrofi.com">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m12.5 4.75-5 5.25 5 5.25" /></svg>
      <span>daniasyrofi.com</span>
    </a>

    <nav class="header-actions" aria-label="Project links">
      <a class="icon-button" href="https://x.com/dani_asyrofi" target="_blank" rel="noopener noreferrer" aria-label="Dani Asyrofi on X">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h3.75l3.96 5.3 4.7-5.3H19l-5.55 6.28L19.5 19.5h-3.74l-4.48-6.08-5.38 6.08H4.3l6.24-7.06L5 4.5Zm2.4 1.2 9 12.6h1.7l-9-12.6H7.4Z" /></svg>
      </a>
    </nav>
  </header>

  <main class="page-width">
    <section class="intro" aria-labelledby="page-title">
      <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
      <h1 id="page-title">Loading</h1>
      <p>Animated loaders for moments in between.</p>
    </section>

    <section class="specimen-grid" aria-label="Loading collection" data-specimen-grid></section>

    <section class="integration" id="playground" aria-label="Use Loading in your project">
      <div class="integration-section">
        <div class="section-heading">
          <h2 id="installation-title">Installation</h2>
          <div class="framework-options" role="group" aria-label="Code format">
            <button type="button" data-framework="react" aria-pressed="true">React</button>
            <button type="button" data-framework="html" aria-pressed="false">HTML</button>
          </div>
        </div>
        <div class="code-panel">
          <pre tabindex="0" aria-labelledby="installation-title"><code data-install-code></code></pre>
          <button class="copy-code" type="button" data-copy="install" aria-label="Copy install command"><svg class="copy-glyph" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M15 5V4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h1"/></svg><svg class="check-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></button>
        </div>
        <p class="integration-note" data-install-note>Run once from your project root. Loading is copied into <code>components/ui</code>.</p>
      </div>

      <div class="integration-section">
        <div class="section-heading"><h2 id="usage-title">Usage</h2></div>
        <div class="code-panel">
          <pre tabindex="0" aria-labelledby="usage-title"><code data-usage-code></code></pre>
          <button class="copy-code" type="button" data-copy="usage" aria-label="Copy usage code"><svg class="copy-glyph" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M15 5V4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h1"/></svg><svg class="check-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></button>
        </div>
      </div>

      <div class="integration-section">
        <div class="section-heading"><h2 id="playground-title">Playground</h2><button class="reset-playground" type="button">Reset</button></div>
        <div class="playground-controls" aria-labelledby="playground-title">
          <fieldset class="animation-field"><legend>Animation</legend><div class="animation-options" data-animation-options></div></fieldset>
          <div class="playground-settings">
            <fieldset><legend>Size</legend><div class="size-options" role="group" aria-label="Indicator size">
              <button type="button" data-size="64" aria-pressed="true">64<span>px</span></button>
              <button type="button" data-size="32" aria-pressed="false">32<span>px</span></button>
              <button type="button" data-size="20" aria-pressed="false">20<span>px</span></button>
            </div></fieldset>
            <div class="speed-setting"><label for="playground-speed">Speed <output for="playground-speed" data-speed-output>1.00×</output></label><input id="playground-speed" type="range" min="0.25" max="3" step="0.25" value="1" aria-valuetext="1 times speed" /></div>
          </div>
        </div>
        <div class="playground-stage">
          <span class="preview-caption" data-preview-caption>Orbit / 64px</span>
          <div class="indicator-stage"><loading-indicator animation="orbit" size="64" speed="1" aria-label="Orbit loading animation"></loading-indicator></div>
          <button class="toggle-animation" type="button" aria-label="Pause animation" aria-pressed="false"><svg class="pause-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg><svg class="play-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 10 7-10 7Z"/></svg></button>
          <p class="motion-preference">Reduced motion is on. Your preview stays still.</p>
        </div>
      </div>
      <p class="copy-feedback" role="status" aria-live="polite"></p>
      <noscript><p><a href="./indicator.js" download>Download indicator.js</a> to use the HTML component. Enable JavaScript for installation examples and the playground.</p></noscript>
    </section>
  </main>

  <footer class="site-footer page-width">
    <p>By <a href="https://x.com/dani_asyrofi" target="_blank" rel="noopener noreferrer">Dani Asyrofi</a></p>
  </footer>

  <template data-specimen-template>
    <article class="specimen-tile">
      <iframe
        class="specimen-frame"
        title=""
        loading="eager"
        tabindex="-1"
        aria-hidden="true"
        inert
        srcdoc="<style>html,body{min-height:100%;margin:0;background:black}</style>"
      ></iframe>
      <a class="tile-link" href="./specimens/">
        <span class="tile-name"></span>
        <span class="tile-action" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </span>
      </a>
    </article>
  </template>

  <script defer src="./app.js"></script>
  <script type="module" src="./playground.js"></script>
</body>
</html>
